services:
  - type: web
    name: tg-employee-tracker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: DB_PATH
        value: employees.db
